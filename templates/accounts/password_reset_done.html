{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Email Sent | Alumni Job Portal{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="auth-card text-center">
                    <h1 class="h4 fw-semibold mb-3">Check your email</h1>
                    <p class="text-muted mb-3">
                        If an account exists for the provided email, a password reset link has been sent.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
